<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/ai-es-03-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6ef" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="ai-es · Artículos y noticias"
      href="/feed.xml"
    />
    <title>ai-es · IA, software y videojuegos en español</title>
    <!--seo-->
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("ai-es-theme");
        } catch {}
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
